syntax = "proto3";

package orderprocessing;

option java_multiple_files = true;
option java_package = "at.fhv.sysarch.lab2.homeautomation.grpc.orderprocessing";
option java_outer_classname = "OrderProcessingProto";

// Order Service für externe Order-Verarbeitung
service OrderService {
  rpc ProcessOrder(OrderRequest) returns (OrderResponse);
}

// Request für Order-Verarbeitung
message OrderRequest {
  string product_id = 1;
  int32 quantity = 2;
  double unit_price = 3;
}

// Response mit Receipt nach erfolgreicher Verarbeitung
message OrderResponse {
  bool success = 1;
  string order_id = 2;
  string message = 3;
  OrderReceipt receipt = 4;
}

// Receipt Details
message OrderReceipt {
  string order_id = 1;
  string product_id = 2;
  int32 quantity = 3;
  double unit_price = 4;
  double total_price = 5;
  int64 timestamp = 6;
  string status = 7;
}